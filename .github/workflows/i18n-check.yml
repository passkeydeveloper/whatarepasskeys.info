# Flags missed translation updates: when en.json (the source of truth) changes, every
# other locale file must reflect the same change.
#
# Runs only on PRs that touch src/i18n/en.json. Edits to other locale files alone
# don't trigger it.
#
# This is NOT a plain JSON diff between locale files, since translated strings are
# supposed to differ from English. Instead, this check:
#   - Flattens each locale file to dotted key paths (e.g. "nav.home") so it compares
#     by key regardless of nesting, ordering, or formatting.
#   - Reads each file at the PR base SHA via `git show <sha>:<file>` and compares it
#     to the PR head, to find what changed in en.json:
#       added    -> the key must now exist in every other locale
#       changed  -> the key's value must also have changed in every other locale
#       removed  -> the key must be gone from every other locale
#   - Fails if any locale file is missing one of those updates, listing each file and
#     key. Locales that are already out of sync before the PR are only flagged for
#     keys this PR touched.
#   - Treats a locale file added in the same PR as having no base, so it passes as
#     long as it contains the added/changed keys.
#   - Skips keys listed in .github/i18n-ignore.json, for values intentionally
#     identical across locales (URLs, brand names, etc.).
#
# See .github/scripts/check-i18n-parity.cjs for the implementation.
name: Check PRs for translation parity

on:
  pull_request:
    paths:
      - 'src/i18n/en.json'

jobs:
  check-i18n-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check translation value parity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-i18n-parity.cjs