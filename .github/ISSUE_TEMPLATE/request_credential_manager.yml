name: Request a Credential Manager Score
description: Request a score for a specific credential manager
title: "[Credential Manager]: "
labels: ["triage", "cmscore"]
body:
  - type: input
    id: manager-name
    attributes:
      label: Credential manager product name
    validations:
      required: true
  - type: input
    id: docs-link
    attributes:
      label: Developer / Standard Documentation Link
      description: Link to the website or other resource for the credential manager
    validations:
      required: true
  - type: textarea
    id: comments
    attributes:
      label: Comments or Notes
    validations:
      required: false
