name: Request a Credential Manager Score
description: Request a score for a specific credential manager.
title: "[Credential Manager]: Support for "
labels: ["triage", "enhancement", "auth"]
body:
  - type: input
    id: manager-name
    attributes:
      label: Credential Manager Name
      placeholder: Bitwarden, 1Password, Dashlane, KeePass, Proton Pass, etc.
    validations:
      required: true
  - type: dropdown
    id: integration-type
    attributes:
      label: Integration Type
      options:
        - Browser autofill / extension detection
        - Native OS credential provider (Windows Hello, macOS Keychain)
        - WebAuthn / FIDO2 Passkey sync
        - CLI / API integration
        - SSO / Identity Provider federation
    validations:
      required: true
  - type: textarea
    id: current-failure
    attributes:
      label: Current Behavior / Failure Mode
      description: Does autofill fail, is the inline icon missing, or is standard form recognition broken?
      placeholder: The extension fails to trigger autofill on the /login route because input IDs lack standard autocomplete attributes.
    validations:
      required: true
  - type: input
    id: docs-link
    attributes:
      label: Developer / Standard Documentation Link
      description: Link to developer guidelines, autofill heuristics, or API docs for this manager.
      placeholder: https://developer.1password.com/...
