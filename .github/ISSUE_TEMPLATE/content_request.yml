name: Content Request
description: Propose a new feature, tool, or major content addition.
title: "[Content Request]: "
labels: ["triage", "content"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / User Story
      description: What problem does this solve, or what user need does it address?
      placeholder: As a user, I need to... so that...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or implementation you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you have considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      options:
        - label: I am interested in submitting a PR to help implement this feature.
